spring.application.name=order-service
server.port=8082

# Actuator surface — same shape as lab-rat: prometheus for SentinelAgent +
# Prometheus to scrape, health for liveness probes, info for build/diagnostic
# metadata. Everything else stays off.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=order-service

# Log to a file so Sentinel's LogFetcher tool can read it programmatically
# the same way it does for lab-rat.
logging.file.name=application.log

# CORS for the dashboard — only needed if the dashboard ever calls actuator
# directly. After Phase 4, the dashboard goes through sentinel-agent for all
# metrics, but leaving this in keeps options open.
management.endpoints.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
