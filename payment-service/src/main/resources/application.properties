spring.application.name=payment-service
server.port=8083

# Actuator surface — same shape as lab-rat / order-service.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=payment-service

logging.file.name=application.log

management.endpoints.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
