server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # connect-src lists every host the dashboard's fetch / EventSource calls
    # reach from the browser. After Phase 4, the agent at :8081 is the
    # ONLY network destination — service list and health (including lab-rat's)
    # all flow through /api/topology. Direct probes to lab-rat:8080,
    # Prometheus:9090, AlertManager:9093 and Grafana:3000 are gone, and the
    # InfraStrip's links to those services use target="_blank" so they're
    # not subject to connect-src anyway.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8081; frame-ancestors 'none';" always;

    # React Router -- serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
