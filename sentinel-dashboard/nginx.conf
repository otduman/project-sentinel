server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # connect-src must list every host the dashboard's fetch / EventSource calls
    # reach from the browser. The topology hex-glow checks hit each service
    # directly (lab-rat, Prometheus, AlertManager, Grafana) — omitting any of
    # these silently blocks the request and the corresponding hex stays dim.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8081 http://localhost:8080 http://localhost:9090 http://localhost:9093 http://localhost:3000; frame-ancestors 'none';" always;

    # React Router -- serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
