# Prometheus Configuration — Project Sentinel

global:
  scrape_interval: 2s # Fast interval for testing/chaos

# ---------------------------------------------------------------------------
# Alerting
# Tells Prometheus where to send firing alerts. alertmanager is resolved via
# Docker's internal DNS because both containers share the same Compose network.
# ---------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# ---------------------------------------------------------------------------
# Rule Files
# Prometheus loads these files and evaluates every rule on each scrape cycle.
# The path is the in-container path set by the volume mount in docker-compose.
# ---------------------------------------------------------------------------
rule_files:
  - '/etc/prometheus/alert-rules.yml'

# ---------------------------------------------------------------------------
# Scrape Configs
# Scrapes lab-rat's Spring Boot actuator endpoint.
# lab-rat is resolved via Docker's internal DNS because both containers share
# the same Compose network (sentinel-net).
# ---------------------------------------------------------------------------
scrape_configs:
  - job_name: 'lab-rat'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # lab-rat is a named container on sentinel-net — Docker DNS resolves it directly
      - targets: ['lab-rat:8080']

  # Self-observability: scrape the agent's own /actuator/prometheus so its
  # investigation duration, token spend, fallback rate, and success/fail
  # counts land in the same Prometheus that watches lab-rat. The dashboard
  # then renders these alongside everything else — the SRE watching itself.
  - job_name: 'sentinel-agent'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['sentinel-agent:8081']

  # order-service / payment-service — stub microservices in the demo topology.
  # Discovered automatically by the dashboard via /api/topology once they're
  # in this list; no further wiring needed.
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-service:8082']

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-service:8083']
