# Force UTF-8 encoding for the Gradle daemon JVM.
# Required on Windows when the user profile path contains non-ASCII characters
# (e.g. Cyrillic) — without this, Gradle 9.x writes worker classpath temp files
# using the system code page (CP1251/CP1252), which corrupts the paths and causes
# "Could not find or load main class GradleWorkerMain" during test execution.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8
