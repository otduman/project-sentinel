# Prometheus Alert Rules — Project Sentinel
#
# These rules are evaluated on every scrape cycle. When an expression
# stays true for the full `for` duration, Prometheus transitions the
# alert from PENDING to FIRING and forwards it to AlertManager.

groups:
  - name: lab-rat.rules
    rules:

      # ---------------------------------------------------------------
      # HighHeapUsage
      # Fires when the JVM heap consumed by lab-rat exceeds 200 MB for
      # at least 20 seconds. A sustained breach at this level is an
      # early indicator of a memory leak before the JVM runs out of
      # heap and starts throwing OutOfMemoryError.
      # Threshold: 200 MB = 200 * 1024 * 1024 = 209,715,200 bytes
      # ---------------------------------------------------------------
      - alert: HighHeapUsage
        expr: jvm_memory_used_bytes{area="heap"} > 209715200
        for: 20s
        labels:
          severity: warning
        annotations:
          summary: "lab-rat heap usage is above 200 MB"
          description: >
            JVM heap on {{ $labels.instance }} has been above 200 MB for
            over 20 seconds. Current value: {{ $value | humanize }}B.
            Investigate for memory leaks or tune the heap size.

      # ---------------------------------------------------------------
      # CpuLatencySpike
      # Fires when the average HTTP response time across all endpoints
      # exceeds 2 seconds for at least 10 seconds.
      # Derived from Spring Boot's http_server_requests_seconds metrics:
      #   _sum  = total time spent across all requests
      #   _count = total number of requests
      # Dividing gives the mean latency per request.
      # ---------------------------------------------------------------
      - alert: CpuLatencySpike
        expr: >
          http_server_requests_seconds_sum
          /
          http_server_requests_seconds_count
          > 2
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "lab-rat average HTTP response time exceeds 2 seconds"
          description: >
            Mean HTTP response time on {{ $labels.instance }} has been
            above 2 s for over 10 seconds. Current value: {{ $value }}s.
            Check for slow endpoints, thread exhaustion, or GC pauses.

      # ---------------------------------------------------------------
      # AppDown
      # Fires when Prometheus cannot scrape lab-rat at all (the `up`
      # metric drops to 0) for at least 10 seconds. This could mean the
      # Spring Boot process crashed, the port is unreachable, or the
      # actuator endpoint is broken.
      # ---------------------------------------------------------------
      - alert: AppDown
        expr: up{job="lab-rat"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "lab-rat is unreachable"
          description: >
            Prometheus has been unable to scrape {{ $labels.instance }}
            for over 10 seconds. Verify the Spring Boot process is
            running and that /actuator/prometheus is accessible.

  # ---------------------------------------------------------------------------
  # order-service rules — DB-flavoured failure modes. Each alert name encodes
  # the service so the dashboard's SERVICE_ALERT_KEYWORDS_MAP can route
  # firing alerts to the right hex cell, and so the agent's runbook lookup
  # can find a service-specific playbook.
  # ---------------------------------------------------------------------------
  - name: order-service.rules
    rules:

      - alert: OrderServiceSlowQuery
        expr: >
          rate(http_server_requests_seconds_sum{job="order-service"}[1m])
          /
          rate(http_server_requests_seconds_count{job="order-service"}[1m])
          > 2
        for: 15s
        labels:
          severity: warning
          service: order-service
        annotations:
          summary: "order-service mean response time exceeds 2 seconds"
          description: >
            Mean HTTP latency on order-service has been above 2 s for over
            15 seconds. Likely cause: slow downstream query — check
            /chaos/slow-query in the runbook.

      - alert: OrderServiceThreadLeak
        expr: jvm_threads_live_threads{job="order-service"} > 50
        for: 30s
        labels:
          severity: warning
          service: order-service
        annotations:
          summary: "order-service has too many live threads"
          description: >
            jvm_threads_live_threads on order-service has exceeded 50 for
            over 30 seconds. Likely a parked-thread leak — see runbook.

      - alert: OrderServiceDown
        expr: up{job="order-service"} == 0
        for: 10s
        labels:
          severity: critical
          service: order-service
        annotations:
          summary: "order-service is unreachable"
          description: >
            Prometheus has been unable to scrape order-service for over
            10 seconds. Verify the Spring Boot process is running.

  # ---------------------------------------------------------------------------
  # payment-service rules — outbound-dependency flavour failures: timeouts on
  # the downstream PSP, retry-storm memory pressure, and 5xx spikes.
  # ---------------------------------------------------------------------------
  - name: payment-service.rules
    rules:

      - alert: PaymentServiceErrorRate
        expr: >
          sum(rate(http_server_requests_seconds_count{job="payment-service", status=~"5.."}[1m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="payment-service"}[1m])), 0.001)
          > 0.1
        for: 20s
        labels:
          severity: warning
          service: payment-service
        annotations:
          summary: "payment-service 5xx rate above 10%"
          description: >
            More than 10% of payment-service responses have been 5xx for
            over 20 seconds. Likely cause: downstream PSP failures — see
            /chaos/error-rate runbook.

      - alert: PaymentServiceHighHeap
        expr: jvm_memory_used_bytes{area="heap", job="payment-service"} > 104857600
        for: 20s
        labels:
          severity: warning
          service: payment-service
        annotations:
          summary: "payment-service heap above 100 MB"
          description: >
            JVM heap on payment-service has exceeded 100 MB for over
            20 seconds. Likely cause: retry-buffer accumulation — see
            /chaos/memory-pressure runbook.

      - alert: PaymentServiceDown
        expr: up{job="payment-service"} == 0
        for: 10s
        labels:
          severity: critical
          service: payment-service
        annotations:
          summary: "payment-service is unreachable"
          description: >
            Prometheus has been unable to scrape payment-service for over
            10 seconds. Verify the Spring Boot process is running.
