# Tells Grafana to scan /etc/grafana/dashboards for dashboard JSON files
# and auto-load them under the "Sentinel" folder. updateIntervalSeconds: 30
# means edits to a dashboard JSON on disk are picked up within 30s without
# restarting Grafana.

apiVersion: 1

providers:
  - name: 'sentinel'
    orgId: 1
    folder: 'Sentinel'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
