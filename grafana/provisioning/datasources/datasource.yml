# Auto-provisioned Prometheus datasource for Sentinel.
# Grafana reads this on startup; no manual datasource setup required.
# The URL uses Docker DNS — works inside the sentinel-net Compose network.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 2s   # Matches Prometheus scrape interval — keeps step alignment honest
