plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sentinel'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Mockito 5.x: load mockito-core as a Java agent rather than letting it self-attach
// at runtime. Future JDKs will disallow dynamic agent loading, and this configuration
// silences the "self-attaching" warning while staying forward-compatible.
configurations {
	mockitoAgent
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Micrometer's Prometheus registry — converts SentinelMetrics counters/timers
	// into the text format Prometheus scrapes from /actuator/prometheus.
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// LangChain4j 1.13.x — Spring Boot starter dropped because it's not compatible
	// with Spring Boot 4.0 (langchain4j/langchain4j#4268). We wire beans manually
	// in AgentConfiguration.java anyway, so the starter was never required here.
	implementation 'dev.langchain4j:langchain4j:1.13.1'
	implementation 'dev.langchain4j:langchain4j-google-ai-gemini:1.13.1'

	implementation project(':sentinel-core')

	// Database drivers — H2 for dev/default, Postgres for production profile
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Spring Boot 4.0 split @WebMvcTest into its own module
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Version managed by Spring Boot's dependency BOM.
	mockitoAgent('org.mockito:mockito-core') {
		transitive = false
	}
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs("-javaagent:${configurations.mockitoAgent.asPath}")
}

// Load .env from project root and pass as environment variables to bootRun.
// This means you never have to set GEMINI_API_KEY manually in your terminal.
tasks.named('bootRun') {
	def envFile = rootProject.file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			if (!line.startsWith('#') && line.contains('=')) {
				def parts = line.split('=', 2)
				environment parts[0].trim(), parts[1].trim()
			}
		}
	}
}
