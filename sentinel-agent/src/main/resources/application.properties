server.port=8081

gemini.api.key=${GEMINI_API_KEY}

# Path config for tools (overridden by application-docker.properties in Docker)
lab.rat.log.path=../lab-rat/application.log
lab.rat.jar.path=../sentinel-core/build/libs/sentinel-core-1.0-SNAPSHOT.jar

# H2 in-memory database (default/local profile — Docker uses Postgres via application-docker.properties)
spring.datasource.url=jdbc:h2:mem:sentinel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# H2 web console disabled — use the REST API or connect via JDBC in your IDE
spring.h2.console.enabled=false

# Enable scheduling
spring.task.scheduling.pool.size=2

# Allow indefinite async connections (required for SSE / SseEmitter)
spring.mvc.async.request-timeout=-1

# Upstream URLs for the dashboard proxy endpoints (override per profile)
sentinel.proxy.prometheus-url=http://localhost:9090
sentinel.proxy.alertmanager-url=http://localhost:9093

# Optional webhook shared secret — when set, AlertManager must send Authorization: Bearer <value>
# Leave blank to disable the check (safe for fully local / Docker-isolated setups)
agent.webhook.secret=${AGENT_WEBHOOK_SECRET:}

# Patch approval bearer token — REQUIRED for /api/patches/{id}/approve|reject|rollback.
# Unlike the webhook secret, blank here means "endpoints disabled" (fail-closed) because
# approve triggers a real file write into lab-rat in Phase 2. Set this in .env before
# attempting any patch approval — the dashboard reads VITE_PATCH_TOKEN to send the
# matching Authorization header.
agent.patch.secret=${AGENT_PATCH_SECRET:}

# Where the PatchApplier writes backups before overwriting target files. Default is
# inside the bind-mounted lab-rat source so backups travel with the code volume.
agent.patch.backup-dir=${AGENT_PATCH_BACKUP_DIR:/lab-rat-src/.sentinel-backups}

# Per-investigation input-token cap. Bounds the cost of a runaway ReAct loop.
# Enforced by BudgetedChatModel — a TokenBudgetExceededException is thrown
# when an investigation's cumulative input tokens exceed this value.
agent.gemini.token-budget=100000

# Primary chat model — Gemini 3 Flash (preview): Pro-tier reasoning at Flash cost.
# Multi-turn tool calling requires returnThinking/sendThinking on the builder
# (set in AgentConfiguration.buildGemini) to preserve thought_signatures.
gemini.model.primary=gemini-3-flash-preview

# Fallback chat model — automatically used when the primary returns a
# 429 / 503 / RESOURCE_EXHAUSTED / quota error, or when the preview model is
# temporarily unavailable. Gemini 2.5 Flash is GA-stable.
# Wired by FallbackChatModel inside BudgetedChatModel.
gemini.model.fallback=gemini-2.5-flash
