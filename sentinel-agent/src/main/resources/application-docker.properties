# Docker profile — activated via SPRING_PROFILES_ACTIVE=docker in docker-compose.yml
# Absorbs what was formerly split across application-postgres.properties.
# There is no longer a standalone 'postgres' profile; Docker always means Postgres.

# Shared volume path for lab-rat logs (mounted at /logs in both containers)
lab.rat.log.path=/logs/application.log
lab.rat.jar.path=/app/sentinel-core.jar

# PostgreSQL datasource — 'postgres' resolves via Docker DNS on sentinel-net
spring.datasource.url=jdbc:postgresql://postgres:5432/sentinel
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 console disabled in Docker (using Postgres)
spring.h2.console.enabled=false

# Docker service hostnames (Docker DNS resolves these on sentinel-net)
sentinel.proxy.prometheus-url=http://prometheus:9090
sentinel.proxy.alertmanager-url=http://alertmanager:9093

# Silence noisy Hibernate DDL/migration and connection pool logs
logging.level.org.hibernate.tool.schema=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.orm.jpa=WARN
